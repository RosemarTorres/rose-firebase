    <body>
        <div class="container my-4">
            <div class="row">
                <div class="col-sm-12 col-md-12 col-lg-12 col-xl-12">
                    <table id="car-table" class="table table-striped">

                        <thead>
                            <tr>
                                <th class="centered">Modelo</th>
                                <th class="centered">Marca</th>
                                <th class="centered">Vendido</th>
                                <th class="centered">Usuario</th>

                            </tr>
                        </thead>
                        <tbody id="tableBody_users"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <!-- Bootstrap-->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-OERcA2EqjJCMA+/3y+gxIOqMEjwtxJY7qPCqsdltbNJuaOe923+mo//f6V8Qbsw3" crossorigin="anonymous"></script>
        <!-- jQuery -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <!-- DataTable -->
        <script src="https://cdn.datatables.net/1.12.1/js/jquery.dataTables.min.js"></script>
        <script src="https://cdn.datatables.net/1.12.1/js/dataTables.bootstrap5.min.js"></script>
        <!-- Custom JS -->
        <script src=""></script>



        
    <script type="module" src="/JavaScript/firebase.js"></script>

    <script type="module">
      import { collection, getDocs, db, doc } from "/JavaScript/firebase.js";

      async function populateTable() {
        const querySnapshot = await getDocs(collection(db, "ventas"));
        const tableBody = document.querySelector("#car-table tbody");

        querySnapshot.forEach((doc) => {
          const data = doc.data();

          const row = tableBody.insertRow();

          const modeloCell = row.insertCell();
          modeloCell.textContent = data.modelo;

          const marcaCell = row.insertCell();
          marcaCell.textContent = data.marca;

          const vendidoCell = row.insertCell();
          vendidoCell.textContent = data.vendida ? "Sí" : "No";

          const vendidoACell = row.insertCell();
          vendidoACell.textContent = data.usuario || "N/A";
        });
      }

      populateTable();
    </script>
    
  </body>
