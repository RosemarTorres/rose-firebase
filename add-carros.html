     <header>
      <h1>Agregar Modelos</h1>
      
      <nav>
        <ul>
          <li>
            <button type="button" class="button" onclick="regresar()">Regresar</button>
          </li>
          
    
    
    
        </ul>
      </nav>
     </header>
  <body>
    <div class="container">
      <div class="container">
        <!-- Formulario para modelos -->
        <div class="container">
          
          <form id="form-modelo">
            <div class="mb-3">
              <label for="nombre-modelo" class="form-label">Nombre del Modelo</label>
              <input type="text" class="form-control" id="nombre-modelo" required />
            </div>
            <div class="mb-3">
              <label for="marca-modelo" class="form-label">Marca</label>
              <select class="form-control" id="marca-modelo" required></select>
            </div>
            
            <button type="submit" class="btn btn-primary">Enviar</button>
          </form>
        </div>
      </div>

    <div class="container" style="margin-top: 20px;">
      <table id="tabla-modelo" class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Modelo</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <script type="module" src="/JavaScript/firebase.js"></script>
    <script type="module" src="/JavaScript/modelo/add-modelo.js"></script>
    <script type="module" src="/JavaScript/modelo/app.js"></script>
   

    <script type="module">
      import { doc, db, updateDoc, deleteDoc } from "/JavaScript/firebase.js";

      async function eliminarModelo(id) {
        await deleteDoc(doc(db, "modelos", id));
          //recargame la pagina
          window.location.reload();
      }

      // Hacer la función eliminarModelo globalmente accesible
      window.eliminarModelo = eliminarModelo;

      async function editarModelo(id) {
        const nuevoNombreModelo = prompt(
          "Por favor, introduce el nuevo nombre del modelo:"
        );
        if (nuevoNombreModelo) {
          try {
            const refModelo = doc(db, "modelos", id);

            await updateDoc(refModelo, { name: nuevoNombreModelo });
            alert("¡Modelo actualizado con éxito!");
              //recargame la pagina
              window.location.reload();
          } catch (error) {
            console.error("Error actualizando los datos: ", error);
          }
        } else {
          console.log("No se agregó un nuevo nombre de modelo");
          alert("No se hicieron cambios.");
        }
      }

      // Hacer la función editarModelo globalmente accesible
      window.editarModelo = editarModelo;
    </script>

<script type="module">
  import { collection, getDocs, db } from "/JavaScript/firebase.js";

  async function obtenerMarca() {
    const marcasSnapshot = await getDocs(collection(db, "marcas"));
    const selectMarca = document.getElementById("marca-modelo");
    marcasSnapshot.forEach((doc) => {
      const option = document.createElement("option");
      option.value = doc.id;
      option.text = doc.data().name;
      selectMarca.add(option);
    });
  }

  obtenerMarca();

  // ... Resto del código ...
</script>

    <script>
      function regresar() {
        location.href = "/";
      }
    </script>
  </body>
