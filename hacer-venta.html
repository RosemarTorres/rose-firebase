  <body>
    <div class="container">
      <!-- Formulario para ventas -->
      <div class="container">
       
        <form id="form-venta">
          <table class="tabled">
            
              <th>
                <div class="mb-3">
                  <label for="modelo-venta" class="form-label">Modelo</label>
                  <select class="form-control" id="modelo-venta" required></select>

                   <th>

                    <th>

                        <label for="marca-venta" class="form-label">Marca</label>

                      </div>
            
                    </th>
            

          </table>
          

          <button type="submit" class="btn btn-primary">Enviar</button>
        </form>
      </div>
    </div>

    <div class="container" style="margin-top: 20px;">
      <table id="tabla-venta" class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Modelo</th>
            <th>Usuario</th>
            <th>Marca</th>
            <th>Editar</th>
            <th>Eliminar</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>


    <script type="module" src="/JavaScript/firebase.js"></script>
    <script type="module" src="/JavaScript/venta/add-venta.js"></script>
    <script type="module" src="/JavaScript/venta/app.js"></script>
   

    <script type="module">
      import { doc, db, updateDoc, deleteDoc } from "/JavaScript/firebase.js";


      async function eliminarVenta(id) {
        await deleteDoc(doc(db, "ventas", id));
        //recargame la pagina
        window.location.reload();
      }

      // Hacer la función eliminarVenta globalmente accesible
      window.eliminarVenta = eliminarVenta;

      async function editarVenta(id) {
        const nuevoNombreModelo = prompt(
          "Por favor, introduce el nuevo nombre del modelo:"
        );

        const nuevoMarcaVenta = prompt(
          "Por favor, introduce el nuevo nombre de la marca:"
        );


        const nuevoUsuarioVenta = prompt(
          "Por favor, introduce el nuevo usuario de la venta:"
        );
        if (nuevoNombreModelo || nuevoUsuarioVenta ||nuevoMarcaVenta) {
          try {
            const refVenta = doc(db, "ventas", id);

            await updateDoc(refVenta, {
              modelo: nuevoNombreModelo,
              usuario: nuevoUsuarioVenta,
              marca: nuevoMarcaVenta,
            });
            alert("¡Venta actualizada exitosamente!");
            //recargame la pagina
            window.location.reload();
          } catch (error) {
            console.error("Error actualizando documento: ", error);
          }
        } else {
          console.log("No se introdujo un nuevo nombre de modelo o usuario");
          alert("No se hicieron cambios.");
        }
      }

      // Hacer la función editarVenta globalmente accesible
      window.editarVenta = editarVenta;
    </script>

    <script type="module">
      import { collection, getDocs, db, doc } from "/JavaScript/firebase.js";

      async function cargarModelos() {
        const modelosSnapshot = await getDocs(collection(db, "modelos"));
        const selectModelo = document.getElementById("modelo-venta");
        modelosSnapshot.forEach((doc) => {
          const option = document.createElement("option");
          option.value = doc.id;
          option.text = doc.data().name;
          selectModelo.add(option);
        });
      }

  cargarModelos();
</script>
  <script type="module">

          option.value = doc.id;

          selectUsuario.add(option);

      cargarUsuarios();

    </script>
